spring.application.name=monitoring_service
dms.service.discovery.DATA_MANAGEMENT=http://localhost:8082
server.port=8086
dms.administration.service.url=http://localhost:8080
dms.administration.token=initial_password
dms.administration.whitelist=/api/v1/.*
spring.datasource.url=jdbc:postgresql://localhost:54346/postgres
spring.datasource.password=password
spring.datasource.username=user
spring.data.jdbc.dialect=postgresql
spring.flyway.table=flyway_schema_history_monitoring
spring.flyway.baseline-on-migrate=true
mds.monitoring.influx.url=http://localhost:8886
mds.monitoring.influx.username=admin
mds.monitoring.influx.password=password
mds.discovery.zookeeper.base-path=/discovery
mds.discovery.zookeeper.service-name=MONITORING
mds.discovery.zookeeper.session-timeout-ms=600000
mds.discovery.zookeeper.zookeeper-host=localhost:32181
mds.discovery.type=ZOOKEEPER
